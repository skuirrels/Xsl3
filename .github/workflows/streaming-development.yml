name: Streaming development (immutable original benchmark diagnosis)

# Isolated manual controller. The original source workflow and its gates remain unchanged.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full immutable source commit for the original complete benchmark
        type: string
        required: true
permissions:
  contents: read
jobs:
  canonical-benchmark-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require an immutable source revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
          path: benchmark-source
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Record source and runtime provenance
        run: |
          mkdir -p artifacts/canonical-benchmark
          git rev-parse HEAD > artifacts/canonical-benchmark/controller-revision.txt
          git -C benchmark-source rev-parse HEAD > artifacts/canonical-benchmark/source-revision.txt
          git -C benchmark-source ls-tree -r HEAD > artifacts/canonical-benchmark/source-tree.txt
          dotnet --info > artifacts/canonical-benchmark/dotnet-info.txt
          uname -a > artifacts/canonical-benchmark/host.txt
      - name: Build the unchanged source benchmark
        run: |
          set -o pipefail
          dotnet build benchmark-source/bench/Xsl3.Benchmarks -c Release -f net10.0 -m:1 -nr:false -p:UseSharedCompilation=false 2>&1 | tee artifacts/canonical-benchmark/build.log
          dotnet benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll streaming-info > artifacts/canonical-benchmark/runtime.json
          sha256sum benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/{Xsl3.dll,Xsl3.pdb,Xsl3.Benchmarks.dll,Xsl3.Benchmarks.pdb} > artifacts/canonical-benchmark/binary-hashes-before.txt
      - name: Original complete paired benchmark and strict throughput target
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python3 benchmark-source/eng/streaming-benchmark.py --assembly benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll --sizes 1mb 100mb 1gb --rounds 3 --heap-limit 4294967296 --timeout-seconds 900 --require-throughput-target --output artifacts/canonical-benchmark/observations 2>&1 | tee artifacts/canonical-benchmark/benchmark.log
      - name: Retain final source and binary state
        if: always()
        run: |
          if test -d benchmark-source/.git
          then
            git -C benchmark-source status --porcelain --untracked-files=no > artifacts/canonical-benchmark/source-status-after.txt
            test ! -s artifacts/canonical-benchmark/source-status-after.txt
          fi
          if test -f artifacts/canonical-benchmark/binary-hashes-before.txt
          then
            sha256sum benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/{Xsl3.dll,Xsl3.pdb,Xsl3.Benchmarks.dll,Xsl3.Benchmarks.pdb} > artifacts/canonical-benchmark/binary-hashes-after.txt
            cmp artifacts/canonical-benchmark/binary-hashes-before.txt artifacts/canonical-benchmark/binary-hashes-after.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-benchmark-check
          path: |
            artifacts/canonical-benchmark
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.dll
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.pdb
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.pdb
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.deps.json
            benchmark-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.runtimeconfig.json
