name: Streaming development (experimental P7 acceptance)

# P7A closes the foundations release; full P7 streaming remains unsupported.
# These original acceptance targets stay strict and failures stay visible here.
# See docs/plan/p7a-closeout.md; this workflow is separate from release CI.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      memory_diagnosis:
        description: Run identity and saved-loader diagnostics only (never an acceptance gate)
        type: boolean
        default: false
      source_ref:
        description: Immutable source ref for diagnostic controls
        type: string
        default: v1.1.3
      allocation_comparison:
        description: Run bounded P7F identity comparison and original memory matrices
        type: boolean
        default: false
      capacity_comparison:
        description: Compare explicit public fork buffer capacities (never an acceptance gate)
        type: boolean
        default: false
      revision_comparison:
        description: Compare baseline and candidate runtime on one host (diagnostic only)
        type: boolean
        default: false
      cpu_profile:
        description: Capture Linux CPU samples only (never an acceptance gate)
        type: boolean
        default: false
      cpu_workload:
        description: Canonical workload for the CPU diagnostic
        type: choice
        default: fork
        options:
          - fork
          - identity
          - accumulator
          - source-document
          - adjacent
          - iterate
          - merge

permissions:
  contents: read

jobs:
  # S7 uses fresh paired processes so source parsing and first output are measured.
  # The benchmark heap guard is separate from the exact memory gates below.
  streaming-benchmark:
    if: ${{ inputs.memory_diagnosis != true && inputs.allocation_comparison != true && inputs.cpu_profile != true && inputs.capacity_comparison != true && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build the streaming benchmark
        run: dotnet build bench/Xsl3.Benchmarks -c Release -f net10.0 -m:1
      - name: Paired streaming measurements and 100 MB throughput target
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 eng/streaming-benchmark.py --assembly bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll --sizes 1mb 100mb 1gb --rounds 3 --heap-limit 4294967296 --timeout-seconds 900 --require-throughput-target --output artifacts/streaming-benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: streaming-benchmark-nightly
          path: |
            artifacts/streaming-benchmark
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.pdb
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.deps.json
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.runtimeconfig.json
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.dll
            bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.pdb

  # P7 decision 6: exact generated-input size and absolute process/managed limits.
  # A failed or incomplete matrix is a failed job; retained artifacts expose it.
  streaming-memory:
    if: ${{ inputs.memory_diagnosis != true && inputs.cpu_profile != true && inputs.capacity_comparison != true && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: push
            bytes: 209715200
            limit: 20971520
          - name: nightly
            bytes: 2147483648
            limit: 209715200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Install the internal Linux probe linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Publish the NativeAOT streaming probe
        run: |
          mkdir -p artifacts
          set -o pipefail
          eng/publish-stream-probe.sh linux-x64 artifacts/streaming-probe 2>&1 | tee artifacts/streaming-probe-publish.log

      - name: Exact streaming memory gate (${{ matrix.name }})
        run: python3 eng/streaming-gate.py --native artifacts/streaming-probe/bin/Xsl3.StreamingProbe.Native --bytes ${{ matrix.bytes }} --limit ${{ matrix.limit }} --timeout-seconds 900 --output artifacts/streaming-probe-${{ matrix.name }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: streaming-memory-${{ matrix.name }}
          path: |
            artifacts/streaming-probe-publish.log
            artifacts/streaming-probe-${{ matrix.name }}
            artifacts/streaming-probe

  # P7E is an explicitly selected diagnostic job. Scheduled/default acceptance is unchanged.
  identity-memory-diagnosis:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.memory_diagnosis && inputs.allocation_comparison != true && inputs.cpu_profile != true && inputs.capacity_comparison != true && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: baseline-source
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Record diagnostic provenance
        run: |
          mkdir -p artifacts/p7e-memory/linux
          git rev-parse HEAD > artifacts/p7e-memory/linux/diagnostic-revision.txt
          git -C baseline-source rev-parse HEAD > artifacts/p7e-memory/linux/source-revision.txt
          dotnet --info > artifacts/p7e-memory/linux/dotnet-info.txt
          uname -a > artifacts/p7e-memory/linux/host.txt
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_streaming_memory_diagnosis.py'
      - name: Install the internal Linux probe linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Publish unchanged controls and separate diagnostic image
        run: |
          bash baseline-source/eng/publish-stream-probe.sh linux-x64 artifacts/p7e-memory/linux/canonical
          python3 eng/diagnose-streaming-memory.py prepare --source baseline-source --saved artifacts/p7e-memory/linux/canonical/stylesheets --rid linux-x64 --output artifacts/p7e-memory/linux/diagnostic --loader-details
      - name: Measure identity controls and diagnostic phases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 eng/diagnose-streaming-memory.py measure --native artifacts/p7e-memory/linux/canonical/bin/Xsl3.StreamingProbe.Native --output artifacts/p7e-memory/linux/control --sizes 10485760 209715200 2147483648 --rounds 3 --heap-limit 20971520 --mapping-snapshots
          python3 eng/diagnose-streaming-memory.py measure --native artifacts/p7e-memory/linux/diagnostic/bin/Xsl3.StreamingProbe.Native --output artifacts/p7e-memory/linux/instrumented --sizes 10485760 209715200 2147483648 --rounds 3 --heap-limit 20971520 --instrumented --loader-details
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p7e-identity-memory-diagnosis
          path: |
            artifacts/p7e-memory/linux/*.txt
            artifacts/p7e-memory/linux/control
            artifacts/p7e-memory/linux/instrumented
            artifacts/p7e-memory/linux/diagnostic/preparation.json
            artifacts/p7e-memory/linux/diagnostic/source-sha256.json
            artifacts/p7e-memory/linux/diagnostic/publish.log

  # P7F comparisons use the same saved entrypoints on both runtime versions.
  identity-allocation-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allocation_comparison && inputs.cpu_profile != true && inputs.capacity_comparison != true && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: baseline-source
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Freeze sources and provenance
        run: |
          if [ "${{ inputs.memory_diagnosis }}" = true ]; then echo "Select only one diagnostic mode" >&2; exit 64; fi
          mkdir -p artifacts/p7f-identity/linux/source-candidate
          git archive HEAD | tar -x -C artifacts/p7f-identity/linux/source-candidate
          git rev-parse HEAD > artifacts/p7f-identity/linux/candidate-revision.txt
          git -C baseline-source rev-parse HEAD > artifacts/p7f-identity/linux/baseline-revision.txt
          dotnet --info > artifacts/p7f-identity/linux/dotnet-info.txt
          uname -a > artifacts/p7f-identity/linux/host.txt
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_streaming_*.py'
      - name: Install the internal Linux probe linker
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Publish controls and matching diagnostic images
        run: |
          bash baseline-source/eng/publish-stream-probe.sh linux-x64 artifacts/p7f-identity/linux/baseline-native > artifacts/p7f-identity/linux/baseline-publish.log 2>&1
          dotnet publish artifacts/p7f-identity/linux/source-candidate/tests/Xsl3.StreamingProbe.Native -c Release -r linux-x64 -m:1 -p:UseSharedCompilation=false -p:ProbeStylesheetDirectory="$PWD/artifacts/p7f-identity/linux/baseline-native/stylesheets" -o artifacts/p7f-identity/linux/candidate-native > artifacts/p7f-identity/linux/candidate-publish.log 2>&1
          python3 eng/diagnose-streaming-memory.py prepare --source baseline-source --saved artifacts/p7f-identity/linux/baseline-native/stylesheets --rid linux-x64 --output artifacts/p7f-identity/linux/baseline-diagnostic
          python3 eng/diagnose-streaming-memory.py prepare --source artifacts/p7f-identity/linux/source-candidate --saved artifacts/p7f-identity/linux/baseline-native/stylesheets --rid linux-x64 --output artifacts/p7f-identity/linux/candidate-diagnostic
      - name: Paired allocation and uninstrumented throughput
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 eng/compare-identity-allocation.py --baseline-native artifacts/p7f-identity/linux/baseline-native/bin/Xsl3.StreamingProbe.Native --candidate-native artifacts/p7f-identity/linux/candidate-native/Xsl3.StreamingProbe.Native --baseline-diagnostic artifacts/p7f-identity/linux/baseline-diagnostic/bin/Xsl3.StreamingProbe.Native --candidate-diagnostic artifacts/p7f-identity/linux/candidate-diagnostic/bin/Xsl3.StreamingProbe.Native --output artifacts/p7f-identity/linux/comparison --sizes 10485760 209715200 2147483648 --rounds 3 --heap-limit 20971520 --minimum-allocation-reduction 0.2 --maximum-slowdown 1.05
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p7f-identity-allocation-linux
          path: |
            artifacts/p7f-identity/linux/*.txt
            artifacts/p7f-identity/linux/*.log
            artifacts/p7f-identity/linux/comparison
            artifacts/p7f-identity/linux/*-diagnostic/preparation.json
            artifacts/p7f-identity/linux/*-diagnostic/source-sha256.json
            artifacts/p7f-identity/linux/*-diagnostic/publish.log

  # Actual kernel CPU samples distinguish running work from sampled waits and GC polls.
  streaming-cpu-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cpu_profile && inputs.capacity_comparison != true && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CPU_WORKLOAD: ${{ inputs.cpu_workload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: baseline-source
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Record source and host, check kernel prerequisites
        env:
          MEMORY_DIAGNOSIS: ${{ inputs.memory_diagnosis }}
          ALLOCATION_COMPARISON: ${{ inputs.allocation_comparison }}
        run: |
          mkdir -p artifacts/p7-cpu
          git rev-parse HEAD > artifacts/p7-cpu/diagnostic-revision.txt
          git -C baseline-source rev-parse HEAD > artifacts/p7-cpu/source-revision.txt
          dotnet --info > artifacts/p7-cpu/dotnet-info.txt
          uname -a > artifacts/p7-cpu/host.txt
          lscpu >> artifacts/p7-cpu/host.txt
          if [ "$MEMORY_DIAGNOSIS" = true ] || [ "$ALLOCATION_COMPARISON" = true ]; then echo "Select only one diagnostic mode" >&2; exit 64; fi
          if ! mountpoint -q /sys/kernel/tracing; then sudo mount -t tracefs tracefs /sys/kernel/tracing; fi
          sudo test -e /sys/kernel/tracing/user_events_data
      - name: Install pinned profiling tools and runtime symbols
        run: |
          dotnet tool install dotnet-trace --version 10.0.750501 --tool-path "$RUNNER_TEMP/p7-tools"
          dotnet tool install dotnet-symbol --version 10.0.750501 --tool-path "$RUNNER_TEMP/p7-tools"
          "$RUNNER_TEMP/p7-tools/dotnet-trace" --version > artifacts/p7-cpu/trace-version.txt
          runtime_dir=$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ { gsub(/\[|\]/, "", $3); print $3 "/" $2 }' | sort -V | tail -n 1)
          sudo --preserve-env=DOTNET_ROOT "$RUNNER_TEMP/p7-tools/dotnet-symbol" --symbols "$runtime_dir"/lib*.so > artifacts/p7-cpu/symbols.log 2>&1
      - name: Build the unchanged source benchmark
        run: dotnet build baseline-source/bench/Xsl3.Benchmarks -c Release -f net10.0 -m:1
      - name: Profile one canonical 1 GB child
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: sudo --preserve-env=PATH,DOTNET_ROOT,PYTHONDONTWRITEBYTECODE python3 eng/profile-streaming-cpu.py --assembly baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll --trace-tool "$RUNNER_TEMP/p7-tools/dotnet-trace" --workload "$CPU_WORKLOAD" --output "artifacts/p7-cpu/$CPU_WORKLOAD"
      - name: Report actual kernel CPU samples
        run: |
          dotnet build eng/StreamingCpuReport -c Release -m:1
          sudo --preserve-env=DOTNET_ROOT dotnet eng/StreamingCpuReport/bin/Release/net10.0/StreamingCpuReport.dll "artifacts/p7-cpu/$CPU_WORKLOAD/cpu.nettrace" > artifacts/p7-cpu/cpu-sites.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p7-linux-cpu-profile
          path: |
            artifacts/p7-cpu
            baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll
            baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.pdb
            baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.dll
            baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.pdb

  streaming-capacity-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capacity_comparison && inputs.revision_comparison != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: baseline-source
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Record unchanged source and diagnostic host
        env:
          MEMORY_DIAGNOSIS: ${{ inputs.memory_diagnosis }}
          ALLOCATION_COMPARISON: ${{ inputs.allocation_comparison }}
          CPU_PROFILE: ${{ inputs.cpu_profile }}
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/capacity-diagnostic-revision.txt
          git -C baseline-source rev-parse HEAD > artifacts/capacity-source-revision.txt
          dotnet --info > artifacts/capacity-dotnet-info.txt
          uname -a > artifacts/capacity-host.txt
          lscpu >> artifacts/capacity-host.txt
          if [ "$MEMORY_DIAGNOSIS" = true ] || [ "$ALLOCATION_COMPARISON" = true ] || [ "$CPU_PROFILE" = true ]; then echo "Select only one diagnostic mode" >&2; exit 64; fi
      - name: Build the unchanged runtime and canonical benchmark
        run: dotnet build baseline-source/bench/Xsl3.Benchmarks -c Release -f net10.0 -m:1
      - name: Compare explicit capacities through the public compiler API
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 eng/diagnose-streaming-capacity.py --source baseline-source --output artifacts/p7-capacity
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p7-fork-capacity-comparison
          path: |
            artifacts/capacity-*.txt
            artifacts/p7-capacity

  streaming-revision-comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.revision_comparison }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: baseline-source
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Record source and reject mixed diagnostics
        env:
          MEMORY_DIAGNOSIS: ${{ inputs.memory_diagnosis }}
          ALLOCATION_COMPARISON: ${{ inputs.allocation_comparison }}
          CPU_PROFILE: ${{ inputs.cpu_profile }}
          CAPACITY_COMPARISON: ${{ inputs.capacity_comparison }}
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/revision-candidate.txt
          git -C baseline-source rev-parse HEAD > artifacts/revision-baseline.txt
          dotnet --info > artifacts/revision-dotnet-info.txt
          uname -a > artifacts/revision-host.txt
          lscpu >> artifacts/revision-host.txt
          if [ "$MEMORY_DIAGNOSIS" = true ] || [ "$ALLOCATION_COMPARISON" = true ] || [ "$CPU_PROFILE" = true ] || [ "$CAPACITY_COMPARISON" = true ]; then echo "Select only one diagnostic mode" >&2; exit 64; fi
      - name: Build baseline consumer and candidate runtime
        run: |
          dotnet build baseline-source/bench/Xsl3.Benchmarks -c Release -f net10.0 -m:1
          dotnet build src/Xsl3 -c Release -f net10.0 -m:1
      - name: Compare frozen runtime variants through the canonical consumer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 eng/compare-streaming-revisions.py --baseline-assembly baseline-source/bench/Xsl3.Benchmarks/bin/Release/net10.0/Xsl3.Benchmarks.dll --candidate-engine src/Xsl3/bin/Release/net10.0/Xsl3.dll --workloads identity accumulator merge fork source-document --output artifacts/p7-revisions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p7-runtime-revision-comparison
          path: |
            artifacts/revision-*.txt
            artifacts/p7-revisions
