name: CI

on:
  push:
    branches: [main]
  pull_request:
    # (labeled: the perf-accepted label re-runs the checks with the perf gate advisory.)
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet build Xsl3.slnx -c Release

      # Unit tests, including the checks that every bridge to System.Private.Xml internals binds on this runtime.
      - name: Unit tests
        run: dotnet test tests/Xsl3.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results

      # Functional probe checks only. The approved absolute RSS gates remain separate and unmet.
      - name: Streaming process probe smoke
        if: matrix.os == 'ubuntu-latest'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s eng/tests -p 'test_streaming_*.py'
          python3 eng/streaming-gate.py --assembly tests/Xsl3.Tests/bin/Release/net10.0/Xsl3.Tests.dll --bytes 2097152 --baseline-bytes 65536 --limit 0 --output artifacts/test-results/streaming-probe-smoke

      # The XSLT 1.0 regression gate (SPEC §20): upstream's XslCompiledTransform tests, 100% on both TFMs.
      # PlatformSpecific tests for other platforms and conditional ActiveIssues carry category=failing.
      - name: Upstream tests
        run: dotnet test tests/Xsl3.Upstream.Tests -c Release --no-build --filter "category!=failing" --logger trx --results-directory artifacts/test-results

      # Byte-for-byte comparison with stock System.Xml.Xsl over the 1.0 corpus.
      - name: Differential tests
        run: dotnet test tests/Xsl3.Differential -c Release --no-build --logger trx --results-directory artifacts/test-results

      # W3C QT3 (XPath 3.1 / F&O 3.1), tracked against tests/Xsl3.W3C/baselines; the TEI Stylesheets against their
      # expected results.
      # About one xslt30-test case in ten compiles into a saved assembly and runs from it (Sink B round trip).
      - name: W3C tests
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_W3C_SAVED: "10"
        run: |
          eng/fetch-w3c.sh
          eng/fetch-bench.sh
          dotnet test tests/Xsl3.W3C -c Release --no-build --logger trx --results-directory artifacts/test-results

      # P7 S1: the analysis-only sets are not listed in the suite's main catalogue. These run through
      # the XPath AST hook and a separate baseline; they do not claim streamed execution.
      - name: Posture and sweep analysis
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: sandp
        run: dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability

      - name: Streaming development baseline (UNSTREAMED)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: strm
        run: dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streaming-unstreamed

      # Pass rates per test set and per spec and feature (remaining-scope 8.5), as docs/conformance-sets.md is
      # generated: in the job summary and the test-results artifact.
      - name: Conformance report
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          eng/conformance-report.sh tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports artifacts/test-results/conformance-sets.md
          cat artifacts/test-results/conformance-sets.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  # Sink B (docs/plan/p4-sink-b.md, B4): a stylesheet compiled ahead of time by Xsl3.Build's targets, published with
  # NativeAOT (no trim or AOT warnings allowed) and run; the sample checks its own output.
  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No trim or AOT analysis warnings allowed (IL2xxx, IL3xxx).
      - name: Publish the NativeAOT sample
        run: |
          set -o pipefail
          dotnet publish samples/Xsl3.AotSample -c Release -r linux-x64 -o artifacts/aot 2>&1 | tee artifacts-publish.log
          if grep -E "warning IL[23][0-9]{3}" artifacts-publish.log; then echo "Trim or AOT warnings"; exit 1; fi

      - name: Run it
        run: artifacts/aot/Xsl3.AotSample

      # Saved versions of all real process workloads. This smoke proves the native
      # artifact and its public legacy result-delivery path; limit 0 is not a budget pass.
      - name: Publish the NativeAOT streaming probe
        run: |
          set -o pipefail
          eng/publish-stream-probe.sh linux-x64 artifacts/streaming-probe 2>&1 | tee artifacts/streaming-probe-publish.log

      # PublishAot also disables the dynamic-code feature switch in this managed
      # intermediate. It must still be rejected as a CoreCLR-hosted process.
      - name: Reject the JIT-hosted streaming probe
        run: |
          set +e
          dotnet tests/Xsl3.StreamingProbe.Native/bin/Release/net10.0/linux-x64/Xsl3.StreamingProbe.Native.dll stream-probe identity stream 1024 0 > artifacts/streaming-probe-jit-guard.stdout 2> artifacts/streaming-probe-jit-guard.stderr
          probe_status=$?
          set -e
          test "$probe_status" -eq 1
          grep -Fq "must be published with NativeAOT" artifacts/streaming-probe-jit-guard.stderr

      - name: NativeAOT streaming probe smoke
        run: python3 eng/streaming-gate.py --native artifacts/streaming-probe/bin/Xsl3.StreamingProbe.Native --bytes 2097152 --baseline-bytes 65536 --limit 0 --output artifacts/streaming-probe-smoke

      # Full P7 RSS/throughput acceptance is tracked in streaming-development.yml.
      # P7A ships foundations with streaming unsupported (docs/plan/p7a-closeout.md).

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-streaming-probe
          path: |
            artifacts/streaming-probe-publish.log
            artifacts/streaming-probe-jit-guard.*
            artifacts/streaming-probe-smoke

  # The performance and allocation gate (remaining-scope 1.7): the XSLT 3.0 micro suite on this branch against the
  # base branch, in the same job and alternating, so runner noise hits both. Fails on more than 5% slower (geometric
  # mean) or more than 5% more allocation in any benchmark. The results are in the perf artifact. A deliberate trade
  # (more compile allocation for a faster transform, say) is accepted by the owner with the perf-accepted label, which
  # makes this job advisory.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Micro suite against the base branch
        run: eng/perf-gate.sh origin/${{ github.base_ref }} 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: artifacts/perf
