name: CI

on:
  push:
    branches: [main]
  pull_request:
    # (labeled: the perf-accepted label re-runs the checks with the perf gate advisory.)
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet build Xsl3.slnx -c Release

      # Unit tests, including the checks that every bridge to System.Private.Xml internals binds on this runtime.
      - name: Unit tests
        run: dotnet test tests/Xsl3.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results

      # P7H: the original assertion requires a Debug library as well as debug stylesheets.
      - name: Debug compiler source-line contracts
        run: dotnet test tests/Xsl3.Tests -c Debug --filter "FullyQualifiedName~BareVariableSequencesKeepIdentity|FullyQualifiedName~DebugSourceLineTests" --logger trx --results-directory artifacts/test-results/debug-source-lines

      # Functional probe checks only. The approved absolute RSS gates remain separate and unmet.
      - name: Streaming process probe smoke
        if: matrix.os == 'ubuntu-latest'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s eng/tests -p 'test_streaming_*.py'
          python3 eng/streaming-gate.py --assembly tests/Xsl3.Tests/bin/Release/net10.0/Xsl3.Tests.dll --bytes 2097152 --baseline-bytes 65536 --limit 0 --output artifacts/test-results/streaming-probe-smoke

      # The XSLT 1.0 regression gate (SPEC §20): upstream's XslCompiledTransform tests, 100% on both TFMs.
      # PlatformSpecific tests for other platforms and conditional ActiveIssues carry category=failing.
      - name: Upstream tests
        run: dotnet test tests/Xsl3.Upstream.Tests -c Release --no-build --filter "category!=failing" --logger trx --results-directory artifacts/test-results

      # Byte-for-byte comparison with stock System.Xml.Xsl over the 1.0 corpus.
      - name: Differential tests
        run: dotnet test tests/Xsl3.Differential -c Release --no-build --logger trx --results-directory artifacts/test-results

      # W3C QT3 (XPath 3.1 / F&O 3.1), tracked against tests/Xsl3.W3C/baselines; the TEI Stylesheets against their
      # expected results.
      # About one xslt30-test case in ten compiles into a saved assembly and runs from it (Sink B round trip).
      - name: W3C tests
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_W3C_SAVED: "10"
        run: |
          eng/fetch-w3c.sh
          eng/fetch-bench.sh
          dotnet test tests/Xsl3.W3C -c Release --no-build --logger trx --results-directory artifacts/test-results

      # P7 S1: the analysis-only sets are not listed in the suite's main catalogue. These run through
      # the XPath AST hook and a separate baseline; they do not claim streamed execution.
      - name: Posture and sweep analysis
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: sandp
          XSL3_XSLT30_ASSESSMENTS: ${{ github.workspace }}/artifacts/test-results/streamability-assessments.jsonl
        run: |
          mkdir -p artifacts/test-results
          sandp_exit=0
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability || sandp_exit=$?
          cp tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports/xslt30-run-sandp.md artifacts/test-results/
          if [ "$sandp_exit" -ne 0 ]; then exit "$sandp_exit"; fi
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_*streamability*.py'
          python3 eng/audit-streamability.py --suite external/xslt30-test --assessments "$XSL3_XSLT30_ASSESSMENTS" --output artifacts/test-results/streamability-audit.json

      # An exact-code audit, separate from the ordinary runner's permissive error accounting.
      # Its two raw-suite expectation conflicts stay visible; matching a baseline is not S2 completion.
      - name: Static streamability diagnostics (S2)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: s2
        run: |
          s2_exit=0
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability-static || s2_exit=$?
          cp tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports/xslt30-static-streamability.* artifacts/test-results/
          exit "$s2_exit"

      # The explicit P7B revision preserves the raw 919-case run above and maps every source part.
      - name: Prepare reviewed P7B fixtures
        if: matrix.os == 'ubuntu-latest'
        id: prepare-reviewed
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 eng/prepare-streamability-suite.py --suite external/xslt30-test --output "$RUNNER_TEMP/xsl3-p7b-reviewed"
          cp "$RUNNER_TEMP/xsl3-p7b-reviewed/review.json" artifacts/test-results/p7b-review.json

      - name: Reviewed posture and sweep acceptance (1000 cases)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: sandp-reviewed
          XSL3_XSLT30_REVIEWED: ${{ runner.temp }}/xsl3-p7b-reviewed
          XSL3_XSLT30_ASSESSMENTS: ${{ github.workspace }}/artifacts/test-results/streamability-reviewed-assessments.jsonl
        run: |
          reviewed_exit=0
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability-reviewed || reviewed_exit=$?
          cp tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports/xslt30-run-sandp-reviewed.md artifacts/test-results/
          exit "$reviewed_exit"

      - name: Reviewed static streamability acceptance (155 cases)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: s2-reviewed
          XSL3_XSLT30_REVIEWED: ${{ runner.temp }}/xsl3-p7b-reviewed
        run: |
          reviewed_exit=0
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability-static-reviewed || reviewed_exit=$?
          cp tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports/xslt30-static-streamability-reviewed.* artifacts/test-results/
          exit "$reviewed_exit"

      - name: Debug streamability declaration regressions
        if: matrix.os == 'ubuntu-latest' && !cancelled() && steps.prepare-reviewed.outcome == 'success'
        run: |
          dotnet test tests/Xsl3.Tests -c Debug -m:1 -p:UseSharedCompilation=false --filter "FullyQualifiedName~StreamingDeclarationTests" --logger trx --results-directory artifacts/test-results/streamability-declarations-debug

      - name: Build Debug W3C harness
        if: matrix.os == 'ubuntu-latest' && !cancelled() && steps.prepare-reviewed.outcome == 'success'
        id: debug-w3c
        run: |
          dotnet build tests/Xsl3.W3C -c Debug -m:1 -p:UseSharedCompilation=false

      - name: Debug reviewed posture and sweep acceptance
        if: matrix.os == 'ubuntu-latest' && !cancelled() && steps.debug-w3c.outcome == 'success'
        env:
          XSL3_XSLT30_PROFILE: sandp-reviewed
          XSL3_XSLT30_REVIEWED: ${{ runner.temp }}/xsl3-p7b-reviewed
        run: |
          debug_exit=0
          dotnet test tests/Xsl3.W3C -c Debug --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability-reviewed-debug || debug_exit=$?
          cp tests/Xsl3.W3C/bin/Debug/net10.0/w3c-reports/xslt30-run-sandp-reviewed.md artifacts/test-results/xslt30-run-sandp-reviewed-debug.md
          exit "$debug_exit"

      - name: Debug reviewed static streamability acceptance
        if: matrix.os == 'ubuntu-latest' && !cancelled() && steps.debug-w3c.outcome == 'success'
        env:
          XSL3_XSLT30_PROFILE: s2-reviewed
          XSL3_XSLT30_REVIEWED: ${{ runner.temp }}/xsl3-p7b-reviewed
        run: |
          debug_exit=0
          dotnet test tests/Xsl3.W3C -c Debug --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streamability-static-reviewed-debug || debug_exit=$?
          cp tests/Xsl3.W3C/bin/Debug/net10.0/w3c-reports/xslt30-static-streamability-reviewed.json artifacts/test-results/xslt30-static-streamability-reviewed-debug.json
          cp tests/Xsl3.W3C/bin/Debug/net10.0/w3c-reports/xslt30-static-streamability-reviewed.md artifacts/test-results/xslt30-static-streamability-reviewed-debug.md
          exit "$debug_exit"

      # P7C retains the complete pre-change failure inventory; it does not claim streaming support.
      - name: Streaming runtime regression baseline (STRICT FORWARD INPUTS)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: strm
          XSL3_STREAM_STRICT: "1"
          XSL3_XSLT30_RESULTS: ${{ github.workspace }}/artifacts/test-results/streaming-strict.jsonl
        run: |
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streaming-strict
          python3 eng/audit-streaming-runtime.py --report "$XSL3_XSLT30_RESULTS" --suite external/xslt30-test --engine src/Xsl3/bin/Release/net10.0/Xsl3.dll --manifest docs/plan/p7-runtime-inventory.json --output artifacts/test-results/streaming-strict-audit.json

      # Same frozen selection with a Debug engine; an inventory audit does not waive P7's memory gates.
      - name: Debug strict streaming runtime inventory
        if: matrix.os == 'ubuntu-latest' && !cancelled() && steps.debug-w3c.outcome == 'success'
        env:
          XSL3_XSLT30_PROFILE: strm
          XSL3_STREAM_STRICT: "1"
          XSL3_XSLT30_RESULTS: ${{ github.workspace }}/artifacts/test-results/streaming-strict-debug.jsonl
        run: |
          dotnet test tests/Xsl3.W3C -c Debug --no-build --filter "FullyQualifiedName~Xslt30Conformance|FullyQualifiedName~RuntimeCaseReportTests" --logger trx --results-directory artifacts/test-results/streaming-strict-debug
          python3 eng/audit-streaming-runtime.py --report "$XSL3_XSLT30_RESULTS" --suite external/xslt30-test --engine src/Xsl3/bin/Debug/net10.0/Xsl3.dll --manifest docs/plan/p7-runtime-inventory.json --output artifacts/test-results/streaming-strict-debug-audit.json

      - name: Legacy strict runtime inventory with saved sampling
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: strm
          XSL3_STREAM_STRICT: "1"
          XSL3_W3C_API: "0"
          XSL3_W3C_SAVED: "10"
          XSL3_XSLT30_RESULTS: ${{ github.workspace }}/artifacts/test-results/streaming-strict-legacy.jsonl
        run: |
          dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streaming-strict-legacy
          python3 eng/audit-streaming-runtime.py --report "$XSL3_XSLT30_RESULTS" --suite external/xslt30-test --engine src/Xsl3/bin/Release/net10.0/Xsl3.dll --manifest docs/plan/p7-runtime-inventory.json --output artifacts/test-results/streaming-strict-legacy-audit.json

      - name: Streaming development baseline (UNSTREAMED)
        if: matrix.os == 'ubuntu-latest'
        env:
          XSL3_XSLT30_PROFILE: strm
        run: dotnet test tests/Xsl3.W3C -c Release --no-build --filter "FullyQualifiedName~Xslt30Conformance" --logger trx --results-directory artifacts/test-results/streaming-unstreamed

      # Pass rates per test set and per spec and feature (remaining-scope 8.5), as docs/conformance-sets.md is
      # generated: in the job summary and the test-results artifact.
      - name: Conformance report
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          eng/conformance-report.sh tests/Xsl3.W3C/bin/Release/net10.0/w3c-reports artifacts/test-results/conformance-sets.md
          cat artifacts/test-results/conformance-sets.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  # Sink B (docs/plan/p4-sink-b.md, B4): a stylesheet compiled ahead of time by Xsl3.Build's targets, published with
  # NativeAOT (no trim or AOT warnings allowed) and run; the sample checks its own output.
  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # No trim or AOT analysis warnings allowed (IL2xxx, IL3xxx).
      - name: Publish the NativeAOT sample
        run: |
          set -o pipefail
          dotnet publish samples/Xsl3.AotSample -c Release -r linux-x64 -o artifacts/aot 2>&1 | tee artifacts-publish.log
          if grep -E "warning IL[23][0-9]{3}" artifacts-publish.log; then echo "Trim or AOT warnings"; exit 1; fi

      - name: Run it
        run: artifacts/aot/Xsl3.AotSample

      # Saved versions of all real process workloads. This smoke proves the native
      # artifact and its public legacy result-delivery path; limit 0 is not a budget pass.
      - name: Publish the NativeAOT streaming probe
        run: |
          set -o pipefail
          eng/publish-stream-probe.sh linux-x64 artifacts/streaming-probe 2>&1 | tee artifacts/streaming-probe-publish.log

      # PublishAot also disables the dynamic-code feature switch in this managed
      # intermediate. It must still be rejected as a CoreCLR-hosted process.
      - name: Reject the JIT-hosted streaming probe
        run: |
          set +e
          dotnet tests/Xsl3.StreamingProbe.Native/bin/Release/net10.0/linux-x64/Xsl3.StreamingProbe.Native.dll stream-probe identity stream 1024 0 > artifacts/streaming-probe-jit-guard.stdout 2> artifacts/streaming-probe-jit-guard.stderr
          probe_status=$?
          set -e
          test "$probe_status" -eq 1
          grep -Fq "must be published with NativeAOT" artifacts/streaming-probe-jit-guard.stderr

      - name: NativeAOT streaming probe smoke
        run: python3 eng/streaming-gate.py --native artifacts/streaming-probe/bin/Xsl3.StreamingProbe.Native --bytes 2097152 --baseline-bytes 65536 --limit 0 --output artifacts/streaming-probe-smoke

      - name: Saved copied-attribute identity contracts (.NET 8/10 and NativeAOT)
        run: bash eng/verify-attribute-identity.sh linux-x64 artifacts/attribute-identity

      - name: Saved bare-variable contracts from Release and Debug compilers
        run: |
          bash eng/verify-attribute-identity.sh linux-x64 artifacts/debug-source-lines-release --bare-variable Release
          bash eng/verify-attribute-identity.sh linux-x64 artifacts/debug-source-lines-debug --bare-variable Debug

      # Full P7 RSS/throughput acceptance is tracked in streaming-development.yml.
      # P7A ships foundations with streaming unsupported (docs/plan/p7a-closeout.md).

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-streaming-probe
          path: |
            artifacts/streaming-probe-publish.log
            artifacts/streaming-probe-jit-guard.*
            artifacts/streaming-probe-smoke
            artifacts/attribute-identity
            artifacts/debug-source-lines-release
            artifacts/debug-source-lines-debug

  # The performance and allocation gate (remaining-scope 1.7): the XSLT 3.0 micro suite on this branch against the
  # base branch, in the same job and alternating, so runner noise hits both. Fails on more than 5% slower (geometric
  # mean) or more than 5% more allocation in any benchmark. The results are in the perf artifact. A deliberate trade
  # (more compile allocation for a faster transform, say) is accepted by the owner with the perf-accepted label, which
  # makes this job advisory.
  perf:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Micro suite against the base branch
        run: eng/perf-gate.sh origin/${{ github.base_ref }} 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: artifacts/perf
