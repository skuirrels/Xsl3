name: Release

# Publishes the Xsl3 package to nuget.org when a version tag is pushed: v0.1.0, v0.1.0-alpha, v1.2.3-beta.4, ...
# The package version is the tag without its "v". nuget.org trusts this workflow file (trusted publishing), so no
# API key is stored in the repository; set the repository variable NUGET_USER to the nuget.org account name.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag they were taken from is in the comment).
jobs:
  # Builds, tests and packs with no publishing credentials.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release tags must point at a commit on main"; exit 1; }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Package version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account name"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet build Xsl3.slnx -c Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      # The fast gates; CI runs the full suites (Differential, W3C) on every push to main.
      - name: Unit tests
        run: dotnet test tests/Xsl3.Tests -c Release --no-build

      - name: Upstream tests
        run: dotnet test tests/Xsl3.Upstream.Tests -c Release --no-build --filter "category!=failing"

      - name: Pack
        run: >
          dotnet pack src/Xsl3 -c Release --no-build -o artifacts/packages
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: artifacts/packages

  # Publishes what the build job packed; only this job can mint a NuGet key.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment in the nuget.org trusted-publishing policy; its protection rules (a required
    # reviewer) gate every release.
    environment: nuget
    permissions:
      contents: read
      id-token: write # the OIDC token nuget.org exchanges for a short-lived API key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
